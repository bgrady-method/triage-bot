# Routine: daily-digest  (v0.1 — Layer 3 of noise-reduction)
#
# Runs once daily (Task Scheduler, 18:30 local). Reads
# docs/messages/<UTC-date>/digest.jsonl — the queue of triage findings
# that were investigated but didn't get an individual DM today (either
# because of the known-issue suppression window in prompt.md step 7, or
# because they scored below the escalation threshold, or because the
# daily cap was reached). Emits one summary self-DM listing them so
# nothing goes invisible.
#
# Without this routine, Layers 1 and 2 of the noise-reduction plan
# silently drop alerts. With it, suppressed findings are auditable in
# a single end-of-day digest.
#
# Source of truth for the routine; no cloud sync (runs locally via
# Windows Task Scheduler — see scripts/install-tasks.ps1).

name: daily-digest
description: One DM per day summarising investigations deferred from individual DMs.

prompt: |
  You are the triage-bot daily-digest. Run this exact procedure.

  ## Step 0 — bootstrap

  ```bash
  git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/bgrady-method/triage-bot.git" 2>/dev/null || true
  git config user.email "triage-bot@method.me"
  git config user.name "triage-bot"
  ```

  Resolve your own user ID via Slack MCP `users.info` on the authenticated
  user; then `conversations.open` with that user_id to get the self-DM
  channel ID.

  ## Step 1 — Read today's digest

  ```bash
  TODAY=$(date -u +%Y-%m-%d)
  DIGEST_FILE="docs/messages/$TODAY/digest.jsonl"
  if [ ! -f "$DIGEST_FILE" ] || [ ! -s "$DIGEST_FILE" ]; then
      echo "No digest entries today — exiting silently."
      exit 0
  fi
  ```

  Parse `$DIGEST_FILE`. Each line is a JSON object with: `ts`, `alert_hash`,
  `channel`, `classification`, `gate_reason`, and one of `matched_kb` +
  `occurrences` (for known-issue-recurrence) or `escalation_score`
  (for needs-human).

  ## Step 2 — Group and summarise

  Group by `gate_reason`:
    - `known-issue-window` → "Known-issue recurrences (suppressed by 24h window)"
    - `low-impact` → "Low-impact needs-human (score < threshold)"
    - `daily-cap` → "Hard-capped (top alerts already DM'd today)"
    - `operator-engaged` → "Suppressed because humans engaged in-channel"

  For each group, list each entry on its own line with: alert hash (short),
  channel, time (HH:MM UTC), one-line context (the matched_kb id for
  recurrences; the bot's bug-type-guess / hypothesis for needs-human),
  and the investigation file path.

  Also tally:
    - Total investigated today (count `kb/incident-log.jsonl` lines with
      today's UTC date, excluding `classification=poll-cycle`,
      `classification=grouped`, and `classification=heartbeat`).
    - Total DM'd individually (count `"message_type":"needs-human"` and
      `"message_type":"known-issue-recurrence"` in today's `self-dm.jsonl`).
    - Total deferred to digest (count lines in `$DIGEST_FILE`).

  ## Step 3 — Compose and send the DM

  Format the message:

  ```
  :bar_chart: triage-bot daily digest — <YYYY-MM-DD>
  <total_investigated> investigated · <total_dmed> DM'd individually · <total_deferred> deferred to this digest.

  Known-issue recurrences (suppressed by 24h window):
    • ki-<id> × <count> (last seen <HH:MM>Z)
    • ...

  Low-impact needs-human (score < <threshold>, classification only):
    • <hash> #<channel> <HH:MM>Z score=<N> — <one-line summary>
      → docs/investigations/<date>-<hash>.md
    • ...

  Hard-capped (top alerts already DM'd today):
    • <hash> #<channel> <HH:MM>Z score=<N> — <one-line summary>
      → docs/investigations/<date>-<hash>.md
    • ...

  Suppressed by in-channel operator engagement:
    • <hash> #<channel> <HH:MM>Z — <one-line summary>
    • ...
  ```

  Omit any sub-section that has no entries.

  Send via Slack MCP `chat.postMessage` to the self-DM channel.

  ## Step 4 — Log the outbound message

  Append the standard line to `docs/messages/<UTC-date>/self-dm.jsonl`:

  ```json
  {"ts":"<iso>","channel_id":"<D...>","channel_name":"self-dm","recipient":"self-dm","message_type":"daily-digest","alert_hash":null,"thread_ts":null,"body":"<full text>"}
  ```

  ## Step 5 — Commit and push

  ```bash
  git add docs/messages/
  git commit -m "daily-digest <YYYY-MM-DD>: <N> deferred entries" || true
  # The wrapper (scripts/run-routine.ps1) handles the push.
  ```

  Do not edit `kb/incident-log.jsonl` — the digest is read-only over the
  triage routine's outputs.

  ## Hard rules

  1. Never edit `kb/incident-log.jsonl`, `kb/known-issues.json`, or
     `kb/false-alarms.json` from this routine.
  2. Never DM more than once per day from this routine — if `self-dm.jsonl`
     already contains a `"message_type":"daily-digest"` line for today, exit
     silently. Idempotent re-runs are no-ops.
  3. Never post to #swat (per the project-wide hard rule).
  4. If `$DIGEST_FILE` is empty or missing, exit silently. No "nothing
     to digest" DM — that's noise.

trigger:
  type: local-task-scheduler
  expression: "daily 18:30 local"   # see scripts/install-tasks.ps1

mcp_connectors:
  - slack

secrets:
  - GH_TOKEN
