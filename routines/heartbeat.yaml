# Routine: heartbeat  (v0.7 — adds outbound-message logging)
#
# Runs every 6h. DMs Ben a one-liner summarizing the bot's state, exercises
# each external tool the triage and stability-review routines rely on, and
# enforces the daily spend cap by flipping kb/config.json.enabled to false if
# today's spend exceeds the cap.
#
# This is the canary: if the heartbeat DM goes silent for >12h, OR the
# heartbeat starts reporting tools as failing, Ben should investigate before
# the next triage cycle wastes effort on a broken dependency.
#
# This file is the source of truth for the deployed heartbeat routine.
# When updating: edit here, commit, then sync to https://claude.ai/code/routines
# (trigger id trig_016cuzzVZHdEJ3yAVvezhKaW) — they're not auto-pushed.

name: heartbeat
description: Posts triage-bot status; checks tool availability; enforces spend cap

prompt: |
  You are the triage-bot heartbeat. Run this exact procedure:

  ## Step 1 — Spend + activity stats

  Read kb/incident-log.jsonl. Compute:
    - Per-message lines today (UTC midnight to now), excluding `classification=poll-cycle` summaries
    - Poll-cycle lines today (the cron heartbeat — should be ≥1 every 6h)
    - Lines this week
    - Sum of runtime_cost_usd today (across all line types)
    - Time since last poll-cycle line (this is the most direct "is the cron alive" signal)
    - Last KB update: `git log -1 --format=%ct -- kb/known-issues.json kb/false-alarms.json`

  Read kb/config.json's max_spend_usd.

  ## Step 2 — Tool availability checks

  Run the REST-reachable checks via the helper script:

  ```bash
  python scripts/tool_health.py --pretty > /tmp/tool_health.json
  cat /tmp/tool_health.json
  ```

  Parse the resulting JSON. The script covers:
    - `gh`        — GitHub API auth (`gh api user`)
    - `dd`        — Datadog `/api/v1/validate`
    - `es`        — Elasticsearch `_cluster/health`
    - `sql`       — reported `skipped` (script can't run a real SQL query without a driver)
    - `mongo`     — reported `skipped` (same reason)

  Then run the MCP-tool checks inline (Python can't make MCP calls):

    a. **Slack MCP** — call `mcp__slack__users.info` for `BEN_USER_ID` (resolve via `mcp__slack__auth.test` first if needed). If it returns the profile, slack=ok. If it errors, slack=fail with the error message.

    b. **Atlassian MCP** — call `mcp__claude_ai_Atlassian__atlassianUserInfo` (no args). If it returns a user object, jira=ok. If it errors with auth, jira=fail with the error message. If the connector isn't configured for this routine, jira=skipped with "Atlassian MCP not enabled for heartbeat".

    c. **GitHub MCP** — only checked indirectly through `gh` CLI above; the heartbeat doesn't use the GitHub MCP for anything else.

  Build a combined results table:

  | tool      | status |
  |-----------|--------|
  | gh        | ok / fail / skipped |
  | dd        | ok / fail / skipped |
  | es        | ok / fail / skipped |
  | sql       | (skipped — no driver) |
  | mongo     | (skipped — no driver) |
  | slack     | ok / fail |
  | jira      | ok / fail / skipped |

  ## Step 3 — Decide the post emoji

  Priority (top wins):

  1. If `sum_cost_today > max_spend_usd`:
      - Edit kb/config.json: set "enabled": false
      - git commit kb/config.json with message "heartbeat: daily spend cap reached, disabling"
      - git push origin main
      - Post: `🔴 triage-bot DISABLED: today's spend $X.XX > cap $Y.YY`
      - (Do not run further checks; the bot is off until manually re-enabled.)

  2. If any tool check returned `fail`:
      - Post: `🟡 triage-bot alive but tools degraded · today: N alerts ($X.XX) · last poll <ago>`
      - Add a second line: `tools: gh ✓ dd ✓ es ✗(timeout) slack ✓ jira ✗(401)` (use ✓ for ok, ✗(reason) for fail, omit skipped tools or render as `~` if you want to call them out).
      - Mention the failing tools by name in line 2 so the reader can act without opening the script output.

  3. If `time_since_last_poll_cycle > 90 minutes`:
      - Post: `🟡 triage-bot: no poll cycle in <Nm> — cron may be stuck · tools: <one-line>`

  4. Else (all green):
      - Post: `🟢 triage-bot alive · today: N alerts processed ($X.XX) · last poll <ago> · last KB update <ago> · tools all ok`

  Always keep the post under 4 lines.

  ## Step 3.4 — Send the heartbeat as a DM to Ben

  The heartbeat is now DM'd to Ben (not posted to a channel). Open the self-DM
  and post via the Slack MCP, as Ben:

  ```
  mcp__slack__conversations.open users=$BEN_USER_ID   # BEN_USER_ID resolved in Step 2a
  mcp__slack__chat.postMessage channel=<dm_channel_id> text="<the one-liner>" mrkdwn=true
  ```

  Never post the heartbeat to a public channel — it goes to Ben's DM only.

  ## Step 3.5 — Log the outbound message to disk

  Immediately after the `chat.postMessage` call returns success, append the
  message to `docs/messages/<YYYY-MM-DD-of-send>/self-dm.jsonl` so the
  stability-review routine can synthesise across heartbeat output. Schema
  (one line, mirrors the format used by triage and stability-review):

  ```json
  {"ts": "<iso-8601-utc>", "channel_id": "<D… self-DM channel id>", "channel_name": "self-dm", "recipient": "self-dm", "message_type": "health-status", "alert_hash": null, "thread_ts": null, "body": "<full message text exactly as sent>"}
  ```

  Pseudocode:

  ```bash
  DATE_DIR="docs/messages/$(date -u +%Y-%m-%d)"
  mkdir -p "$DATE_DIR"
  echo "$LINE" >> "$DATE_DIR/self-dm.jsonl"
  ```

  If the send failed, do NOT log — only log on success. Commit picks this
  up alongside the incident-log line in Step 5.

  ## Step 4 — Sanity-check recent alerts

  Sanity-check that recent alerts have incident-log entries.
    - For each alert channel, slack conversations.history last 6h
    - For each non-bot, non-self message: compute alert_hash, grep kb/incident-log.jsonl
    - If any are missing, list them in the heartbeat post (max 3, "...and N more")

  ## Step 4.5 — Suppression sanity-check (noise-reduction canary)

  Count today's incident-log primary entries with `"suppressed_dm":true` vs
  `"suppressed_dm":false` (excluding `classification=poll-cycle`, `grouped`,
  and `heartbeat`). If suppressed-DM count is ≥ 2× the DM-sent count, surface
  one line in the heartbeat post:

      `actionable backlog: <suppressed> suppressed vs <sent> sent today — see docs/actionable/<UTC-date>.md`

  Also: if today's poll-cycle count is ≥ 1 but `docs/actionable/<UTC-date>.md`
  does NOT exist, surface `actionable file missing — triage may have failed to
  commit`. The file's existence is the canary; absence means the cycle never
  ran or never committed.

  Cheap: one grep against today's incident-log lines, one Test-Path on the
  actionable file.

  ## Step 5 — Append to incident log

  Append one line to kb/incident-log.jsonl summarising the heartbeat result so
  later cost-tracking can see it:

  ```json
  {"ts": <epoch>, "classification": "heartbeat", "tool_health": {"gh":"ok","dd":"ok",...}, "fail_count": <N>, "runtime_cost_usd": <est>, "status": "ok"|"degraded"|"disabled"}
  ```

  Commit + push as a follow-up commit so the kb stays clean.

trigger:
  type: cron
  expression: "0 */6 * * *"    # every 6 hours

repos:
  - url: https://github.com/bgrady-method/triage-bot
    branch: main
    push_branches: ["main"]    # heartbeat needs to be able to flip the kill switch

mcp_connectors:
  - slack       # users.info / auth.test for slack-tool check
  - github      # parity with other routines
  - atlassian   # NEW for heartbeat — atlassianUserInfo for jira-tool check

secrets:
  - GH_TOKEN

  # Tool-health checks need the same env vars the triage routine uses, so the
  # heartbeat exercises the actual config that triage and stability-review
  # depend on. If any of these are missing the corresponding tool reports
  # `skipped` (not `fail`) — the heartbeat doesn't gate on optional tools.
  - DD_API_KEY
  - DD_APP_KEY
  - DD_SITE                   # default: datadoghq.com
  - ELK_BASE_URL              # e.g. https://logstash.method.internal:9243
  - ELK_USER
  - ELK_PASS
  - ELK_INDEX_GLOB            # default: logstash-*

settings:
  timeout_minutes: 8           # was 5 — tool checks can each take up to 8s
